name: Run scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install pandas requests supabase

      - run: python scrape.py
